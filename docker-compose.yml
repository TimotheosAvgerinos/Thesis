version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./entrypoint.sh          
    volumes:
      - .:/app                        
      - ./trained_models:/app/trained_models
      - ./plots:/app/plots
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandemic}
      POSTGRES_USER: ${POSTGRES_USER:-pandemic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pandemic}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   

volumes:
  db_data:
