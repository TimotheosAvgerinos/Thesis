<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pandemic Data API Dashboard</title>
    <script>
        // This dashboard depends on Django's API and cannot run as a file.
        if (window.location.protocol === "file:") {
            window.location.replace("http://127.0.0.1:8000/");
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1e1e1e;
            color: #f8f9fa;
            padding-top: 60px;
            font-family: 'Segoe UI', sans-serif;
        }

        .dashboard-card {
            max-width: 700px;
            margin: auto;
            background-color: #2c2c2c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .btn-toggle {
            margin-bottom: 15px;
            width: 100%;
            text-align: left;
            background-color: #343a40;
            color: #ffffff;
        }

        .btn-toggle:hover {
            background-color: #495057;
        }

        .list-group-item {
            background-color: #3c3c3c;
            border: none;
            color: #ffffff;
        }
        img#plotImage { max-width: 100%; height: auto; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <h1>Pandemic Data API Dashboard</h1>

        <div class="mb-3">
            <a class="btn btn-primary w-100 mb-2" href="/swagger/">📘 Swagger API Documentation</a>
        </div>

        <button class="btn btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#modelsCollapse" aria-expanded="false">
            🤖 Available Models
          </button>
          <div class="collapse" id="modelsCollapse">
            <ul id="modelList" class="list-group list-group-flush"></ul>
          </div>

        <button class="btn btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#featuresCollapse" aria-expanded="false">
            🧬 Available Features
          </button>
          <div class="collapse" id="featuresCollapse">
            <ul id="featureList" class="list-group list-group-flush"></ul>
          </div>

        <button class="btn btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#datesCollapse" aria-expanded="false">
            📅 Available Dates
          </button>
          <div class="collapse" id="datesCollapse">
            <ul id="dateList" class="list-group list-group-flush"></ul>
          </div>    
          
        <button class="btn btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#predictCollapse" aria-expanded="false">
            🔍 Show Predictions
        </button>
        <div class="collapse" id="predictCollapse">
            <div class="mb-2 mt-2">
              <select id="predictModelSelect" class="form-select mb-2">
                <option value="">Select Model</option>
              </select>
              <select id="predictFeatureSelect" class="form-select mb-2">
                <option value="">Select Feature</option>
              </select>
              <button id="predictBtn" class="btn btn-outline-light w-100 mb-3">Predict</button>
            </div>
            <div id="predictionTableContainer"></div>
        </div>

        <button class="btn btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#evaluationCollapse" aria-expanded="false">
            📊 Show Evaluation
        </button>
        <div class="collapse" id="evaluationCollapse">
            <div class="mb-2 mt-2">
              <select id="evaluationModelSelect" class="form-select mb-2">
                <option value="">Select Model</option>
              </select>
              <select id="evaluationFeatureSelect" class="form-select mb-2">
                <option value="">Select Feature</option>
              </select>
              <button id="evaluationBtn" class="btn btn-outline-light w-100 mb-3">Evaluate</button>
            </div>
            <div id="evaluationResultContainer"></div>
        </div>

        <button class="btn btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#plotCollapse" aria-expanded="false">
            📈 Show Plot
        </button>
        <div class="collapse" id="plotCollapse">
            <div class="mb-2 mt-2">
              <select id="plotModelSelect" class="form-select mb-2">
                <option value="">Select Model</option>
              </select>
              <select id="plotFeatureSelect" class="form-select mb-2">
                <option value="">Select Feature</option>
              </select>
              <button id="plotBtn" class="btn btn-outline-light w-100 mb-3">Generate Plot</button>
            </div>
            <div id="plotStatus" aria-live="polite"></div>
            <img id="plotImage" alt="">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
          const modelBtn = document.querySelector('[data-bs-target="#modelsCollapse"]');
          const featureBtn = document.querySelector('[data-bs-target="#featuresCollapse"]');
          const dateBtn = document.querySelector('[data-bs-target="#datesCollapse"]');
          const modelSelect = document.getElementById("predictModelSelect");
          const featureSelect = document.getElementById("predictFeatureSelect");
          const predictBtn = document.getElementById("predictBtn");
          const predictionTableContainer = document.getElementById("predictionTableContainer");
          const evaluationModelSelect = document.getElementById("evaluationModelSelect");
          const evaluationFeatureSelect = document.getElementById("evaluationFeatureSelect");
          const evaluationBtn = document.getElementById("evaluationBtn");
          const evaluationResultContainer = document.getElementById("evaluationResultContainer");
          const plotModelSelect = document.getElementById("plotModelSelect");
          const plotFeatureSelect = document.getElementById("plotFeatureSelect");
          const plotBtn = document.getElementById("plotBtn");
          const plotStatus = document.getElementById("plotStatus");
          const plotImage = document.getElementById("plotImage");
          let plotObjectUrl = null;
    
          modelBtn.addEventListener("click", () => {
            const modelList = document.getElementById("modelList");
            if (modelList.children.length === 0) {
              fetch("/api/models/")
                .then(res => res.json())
                .then(data => {
                  const models = data.available_models || data;
                  models.forEach(model => {
                    const li = document.createElement("li");
                    li.textContent = model;
                    li.className = "list-group-item";
                    modelList.appendChild(li);
                  });
                })
                .catch(err => {
                  modelList.innerHTML = '<li class="list-group-item text-danger">Error loading data</li>';
                  console.error(err);
                });
            }
          });
    
          featureBtn.addEventListener("click", () => {
            const featureList = document.getElementById("featureList");
            if (featureList.children.length === 0) {
              fetch("/api/features/")
                .then(res => res.json())
                .then(data => {
                  const features = data.features || data;
                  features.forEach(feature => {
                    const li = document.createElement("li");
                    li.textContent = feature;
                    li.className = "list-group-item";
                    featureList.appendChild(li);
                  });
                })
                .catch(err => {
                  featureList.innerHTML = '<li class="list-group-item text-danger">Error loading data</li>';
                  console.error(err);
                });
            }
          });
    
          dateBtn.addEventListener("click", () => {
            const dateList = document.getElementById("dateList");
            if (dateList.children.length === 0) {
              fetch("/api/dates/")
                .then(res => res.json())
                .then(data => {
                  const start = data.start_date;
                  const end = data.end_date;
    
                  const liStart = document.createElement("li");
                  liStart.textContent = `Start Date: ${start}`;
                  liStart.className = "list-group-item";
    
                  const liEnd = document.createElement("li");
                  liEnd.textContent = `End Date: ${end}`;
                  liEnd.className = "list-group-item";
    
                  dateList.appendChild(liStart);
                  dateList.appendChild(liEnd);
                })
                .catch(err => {
                  dateList.innerHTML = '<li class="list-group-item text-danger">Error loading data</li>';
                  console.error(err);
                });
            }
          });

        fetch("/api/models/")
           .then(res => res.json())
           .then(data => {
            const models = data.available_models || data;
            models.forEach(model => {
              [modelSelect, evaluationModelSelect, plotModelSelect].forEach(select => {
                const option = document.createElement("option");
                option.value = model;
                option.textContent = model;
                select.appendChild(option);
              });
            });
          });
        
        // Populate features
        fetch("/api/features/")
          .then(res => res.json())
          .then(data => {
            const features = data.features || data;
            features.forEach(feature => {
              [featureSelect, evaluationFeatureSelect, plotFeatureSelect].forEach(select => {
                const option = document.createElement("option");
                option.value = feature;
                option.textContent = feature;
                select.appendChild(option);
              });
            });
          });

        predictBtn.addEventListener("click", () => {
            const model = modelSelect.value;
            const feature = featureSelect.value;
        
            if (!model || !feature) {
              predictionTableContainer.innerHTML = '<p class="text-danger">Please select both model and feature.</p>';
              return;
            }
        
            fetch("/api/predict/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ model, feature })
            })
            .then(res => res.json())
            .then(data => {
              const { dates, y_true, y_pred } = data;
        
              let tableHTML = `
                <table class="table table-dark table-striped table-bordered">
                  <thead>
                    <tr>
                      <th scope="col">Date</th>
                      <th scope="col">Actual</th>
                      <th scope="col">Predicted</th>
                    </tr>
                  </thead>
                  <tbody>`;
        
              for (let i = 0; i < dates.length; i++) {
                tableHTML += `
                  <tr>
                    <td>${dates[i]}</td>
                    <td>${y_true[i].toFixed(2)}</td>
                    <td>${y_pred[i].toFixed(2)}</td>
                  </tr>`;
              }
        
              tableHTML += `</tbody></table>`;
              predictionTableContainer.innerHTML = tableHTML;
            })
            .catch(err => {
              predictionTableContainer.innerHTML = '<p class="text-danger">Error loading predictions.</p>';
              console.error(err);
            });
          });

        evaluationBtn.addEventListener("click", () => {
          const model = evaluationModelSelect.value;
          const feature = evaluationFeatureSelect.value;

          if (!model || !feature) {
            evaluationResultContainer.innerHTML = '<p class="text-danger">Please select both model and feature.</p>';
            return;
          }

          evaluationBtn.disabled = true;
          evaluationResultContainer.innerHTML = '<p class="text-secondary">Loading evaluation...</p>';

          fetch("/api/evaluation/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model, feature })
          })
          .then(async response => {
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Evaluation request failed.");
            }
            return data;
          })
          .then(data => {
            const table = document.createElement("table");
            table.className = "table table-dark table-striped table-bordered";

            const tbody = document.createElement("tbody");
            [
              ["Model", data.model],
              ["Feature", data.feature],
              ["MAE", Number(data.MAE).toFixed(4)],
              ["MSE", Number(data.MSE).toFixed(4)],
              ["R²", Number(data.R2).toFixed(4)]
            ].forEach(([label, value]) => {
              const row = document.createElement("tr");
              const labelCell = document.createElement("th");
              const valueCell = document.createElement("td");
              labelCell.scope = "row";
              labelCell.textContent = label;
              valueCell.textContent = value;
              row.append(labelCell, valueCell);
              tbody.appendChild(row);
            });

            table.appendChild(tbody);
            evaluationResultContainer.replaceChildren(table);
          })
          .catch(error => {
            const message = document.createElement("p");
            message.className = "text-danger";
            message.textContent = error.message;
            evaluationResultContainer.replaceChildren(message);
          })
          .finally(() => {
            evaluationBtn.disabled = false;
          });
        });

        plotBtn.addEventListener("click", () => {
          const model = plotModelSelect.value;
          const feature = plotFeatureSelect.value;

          if (!model || !feature) {
            plotStatus.innerHTML = '<p class="text-danger">Please select both model and feature.</p>';
            plotImage.style.display = "none";
            return;
          }

          plotBtn.disabled = true;
          plotStatus.innerHTML = '<p class="text-secondary">Generating plot...</p>';
          plotImage.style.display = "none";

          fetch("/api/plot/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model, feature })
          })
          .then(async response => {
            if (!response.ok) {
              const contentType = response.headers.get("content-type") || "";
              const error = contentType.includes("application/json")
                ? await response.json()
                : { error: await response.text() };
              throw new Error(error.error || "Plot request failed.");
            }
            return response.blob();
          })
          .then(blob => {
            if (plotObjectUrl) {
              URL.revokeObjectURL(plotObjectUrl);
            }
            plotObjectUrl = URL.createObjectURL(blob);
            plotImage.src = plotObjectUrl;
            plotImage.alt = `${model} ${feature} actual and predicted values plot`;
            plotImage.style.display = "block";
            plotStatus.replaceChildren();
          })
          .catch(error => {
            const message = document.createElement("p");
            message.className = "text-danger";
            message.textContent = error.message;
            plotStatus.replaceChildren(message);
          })
          .finally(() => {
            plotBtn.disabled = false;
          });
        });

        window.addEventListener("beforeunload", () => {
          if (plotObjectUrl) {
            URL.revokeObjectURL(plotObjectUrl);
          }
        });
          
        });
    </script>  
</body>
</html>
